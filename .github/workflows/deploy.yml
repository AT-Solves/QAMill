# GitHub Actions CI/CD Pipeline for QAMill VSIX Extension
# Simple, reliable build and release using bash

name: Build & Deploy VSIX v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    name: Build VSIX Package

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build VSIX
      working-directory: vscode-extension
      run: |
        echo "Installing dependencies..."
        npm cache clean --force || true
        npm install --no-audit --no-fund 2>&1 | grep -v "deprecation" | tail -20 || true

        echo "Compiling TypeScript..."
        npm run compile

        echo "Installing vsce..."
        npm install -D vsce@2.15.0

        echo "Packaging VSIX..."
        npx vsce package --allow-star-activation -o ../qamill-mutation-testing-1.2.0.vsix

    - name: Verify VSIX
      run: |
        echo "Verifying VSIX..."
        ls -lh qamill-mutation-testing-1.2.0.vsix
        unzip -t qamill-mutation-testing-1.2.0.vsix > /dev/null && echo "✅ VSIX integrity verified"

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > /tmp/release_notes.md << 'EOF'
        # QAMill v1.2.0 - Production Ready

        ## New Features
        - Team & Organization Management
        - Multi-tenant Architecture
        - Role-Based Access Control
        - Email Invitations System

        ## Improvements
        - Enhanced OAuth Integration (6 providers)
        - Improved Email Distribution (3 providers)
        - Executive Dashboards
        - Compliance Reporting (8 standards)

        ## Installation
        ```
        code --install-extension qamill-mutation-testing-1.2.0.vsix
        ```
        EOF

        echo "Creating GitHub release..."
        gh release create v1.2.0 \
          qamill-mutation-testing-1.2.0.vsix \
          --title "QAMill v1.2.0" \
          --notes-file /tmp/release_notes.md \
          --draft=false \
          2>&1 || echo "Release may already exist"
