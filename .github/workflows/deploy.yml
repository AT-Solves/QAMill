# GitHub Actions CI/CD Pipeline for QAMill VSIX Extension
# Builds and publishes the VS Code extension to the marketplace

name: Build & Deploy VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    name: Build VSIX Package

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: vscode-extension
      run: |
        npm cache clean --force
        npm install --verbose 2>&1 | tail -50

    - name: Compile TypeScript
      working-directory: vscode-extension
      run: npm run compile

    - name: Package VSIX
      working-directory: vscode-extension
      run: |
        npm install -D vsce
        npx vsce package --allow-star-activation -o ../qamill-mutation-testing-1.2.0.vsix

    - name: Verify VSIX
      run: |
        ls -lh qamill-mutation-testing-1.2.0.vsix
        unzip -l qamill-mutation-testing-1.2.0.vsix | head -30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.2.0
        release_name: QAMill v1.2.0
        body: |
          ## QAMill v1.2.0 - Production Ready

          ### New Features
          - Team & Organization Management
          - Multi-tenant Architecture
          - Role-Based Access Control
          - Email Invitations System

          ### Improvements
          - Enhanced OAuth Integration (6 providers)
          - Improved Email Distribution (3 providers)
          - Executive Dashboards
          - Compliance Reporting (8 standards)

          ### Installation
          Download `qamill-mutation-testing-1.2.0.vsix` and install in VS Code:
          ```
          code --install-extension qamill-mutation-testing-1.2.0.vsix
          ```
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./qamill-mutation-testing-1.2.0.vsix
        asset_name: qamill-mutation-testing-1.2.0.vsix
        asset_content_type: application/zip
