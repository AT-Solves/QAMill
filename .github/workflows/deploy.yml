# GitHub Actions CI/CD Pipeline for QAMill VSIX Extension
# Builds and publishes the VS Code extension to the marketplace

name: Build & Deploy VSIX

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    name: Build VSIX Package

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Clean dependencies
      working-directory: vscode-extension
      run: rm -rf node_modules package-lock.json

    - name: Install dependencies
      working-directory: vscode-extension
      run: npm install --prefer-offline --no-audit

    - name: Compile TypeScript
      working-directory: vscode-extension
      run: npm run compile

    - name: Install vsce
      working-directory: vscode-extension
      run: npm install -D vsce@^2.15.0

    - name: Package VSIX
      working-directory: vscode-extension
      run: npx vsce package --allow-star-activation -o ../qamill-mutation-testing-1.2.0.vsix

    - name: Verify VSIX
      run: |
        ls -lh qamill-mutation-testing-1.2.0.vsix
        unzip -t qamill-mutation-testing-1.2.0.vsix | head -20

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsix-package
        path: qamill-mutation-testing-1.2.0.vsix
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: qamill-mutation-testing-1.2.0.vsix
        tag_name: v1.2.0
        name: QAMill v1.2.0
        body: |
          ## QAMill v1.2.0 - Production Ready

          ### New Features
          - Team & Organization Management
          - Multi-tenant Architecture
          - Role-Based Access Control
          - Email Invitations System

          ### Improvements
          - Enhanced OAuth Integration (6 providers)
          - Improved Email Distribution (3 providers)
          - Executive Dashboards
          - Compliance Reporting (8 standards)

          ### Installation
          Download `qamill-mutation-testing-1.2.0.vsix` and install in VS Code:
          ```
          code --install-extension qamill-mutation-testing-1.2.0.vsix
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
